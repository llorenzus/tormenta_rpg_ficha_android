name: Gerar APK Android

on:
  push:
    branches: [ main, 'feat/**' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto nativo Android (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK de Release
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear arquivo APK
        run: mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Tormenta-RPG-Ficha.apk

      - name: Publicar APK para Download nos Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Tormenta-RPG-Ficha
          path: android/app/build/outputs/apk/release/Tormenta-RPG-Ficha.apk
